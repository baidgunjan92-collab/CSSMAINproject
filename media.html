<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        h1 {
            color: blue;
            font-size: 40px;
            padding: 12px;

        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #333;


        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 5px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            flex-wrap: wrap;
        }

        .EmailLink {

            color: blueviolet;
            padding: 10px;
            text-decoration: underline;
            font-size: 25px;

        }

        .Contact {
            font-weight: 800;
            color: blueviolet;
            padding: 10px;
            text-decoration: underline;
            font-size: 25px;

        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px, 5%;
            background-color: #fff;
            border-bottom: 1px solid transparent;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: 0.3sec ease, box-shadow 0.3sec ease, border 0.3sec ease
        }

        .header.scrolled {
            background-color: #fafafa;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0);
            border-bottom: 1px solid #ddd;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            font: size 1rem;
            color: #333;
            transition: 0.3sec ease;

        }

        .nav-link:hover {
            color: blue;
        }

        .login-btn {
            padding: 7px 16px;
            background: rgb(90, 136, 19);
            border-radius: 6px;
            color: rgb(242, 245, 249);
            font: weight 800;

        }

        .contact-btn {
            padding: 7px 16px;
            background: rgb(143, 106, 236);
            border-radius: 6px;
            color: rgb(251, 248, 249);
            font: weight 800;

        }

        .about-btn {
            padding: 7px 16px;
            background: rgb(206, 152, 4);
            border-radius: 6px;
            color: rgb(242, 245, 249);
            font: weight 800;

        }

        .media-btn {
            padding: 7px 16px;
            background: rgb(204, 81, 28);
            border-radius: 6px;
            color: rgb(242, 245, 249);
            font: weight 800;
        }

        .footer {
            padding: 10px;
            -webkit-text-fill-color: rgb(237, 240, 244);
            background-color: blueviolet;

        }
    </style>
</head>

<body>
    <header class="header" id="header">
        <div class="logo-text logo-container">
            <a href="http://127.0.0.1:5500/Poject/index.html">
                <img src=" https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbtafvGv-u_byZ_ippjFbcboz4bzolXIyJ29Zks5qa1zKCAYJKZNX1R2uI&s=10"
                    width="50px">
            </a>
            <span style="font-size:30px">
                <b style="color:rgb(1, 21, 12)"><i> Learn Coding </i> </b>
            </span>
        </div>
        <nav align="right" class="navbar" id="navbar">
            <a href="about.html" class="nav-link about-btn">ABOUT</a>
            <a href="contact.html" class="nav-link nav-link:hover contact-btn">CONTACT</a>
            <a href="login.html" class="nav-link nav-link:hover login-btn">LOGIN</a>
            <a href="media.html" class="nav-link nav-link:hover media-btn">MEDIA</a>
        </nav>
        <div class="hamburger" id="hamburger">
            <span class=" hamburger-span hamburger open-span"></span><span
                class=" hamburger-span hamburger open-span"></span><span
                class=" hamburger-span hamburger open-span"></span>
        </div>
    </header>
    <h1>Media</h1>


    <h2>1. Simple Audio</h2>

</body>
</body>
<hr>
<footer class="footer">

</footer>
<script>
    //hamburger//
    const hamburger = document.getElementById("hamburger")
    const navbar = document.getElementById("navbar")
    hamburger.addEventListener("click", () => {
        navbar.classList.toggle("active");
        hamburger.classList.toggle("open");
    })

    const header = document.getElementById("header")

    window.addEventListener("scroll", () => {
        if (window.scrollY > 20) {
            header.classList.add("scrolled");
        }
        else {
            header.classList.remove("scrolled");
        }
    });
</script
</html>
